  <template id="search-view"><div class="eyebrow">FIND WHAT MATTERS</div><h1>Remember a little.<br><em>Find the rest.</em></h1><p class="subtitle">Search your saved knowledge, even when the details are fuzzy.</p><div class="search-input"><span style="font-size:20px">⌕</span><input aria-label="Prototype search" value="the article about search ranking"/><span class="key">⌘ K</span></div><div class="filter-row"><button class="pill on">All sources</button><button class="pill">Projects ⌄</button><button class="pill">Type ⌄</button><button class="pill">Date ⌄</button></div><div class="search-layout"><div class="panel"><div class="panel-head"><strong>Results for your memory</strong><span>3 likely matches</span></div><div class="result selected"><span class="file-icon">↗</span><div class="result-main"><div class="result-title">A practical guide to search relevance</div><div class="result-meta">searchjournal.org <span>·</span> Saved Oct 12 <span>·</span> Web page</div><div class="result-reason">Matched your note about <span class="match">ranking search results</span> by usefulness.</div></div></div><div class="result"><span class="file-icon pdf">▤</span><div class="result-main"><div class="result-title">Information retrieval field notes.pdf</div><div class="result-meta">PDF <span>·</span> Saved Sep 28 <span>·</span> Project: Context OS</div><div class="result-reason">Page 8 discusses ranking and ambiguous queries.</div></div></div><div class="result"><span class="file-icon note">✎</span><div class="result-main"><div class="result-title">Ideas for finding forgotten articles</div><div class="result-meta">Personal note <span>·</span> Saved Nov 2</div><div class="result-reason">Your note mentions relevance and source clues.</div></div></div></div><aside class="panel preview"><div class="preview-kicker">SOURCE PREVIEW</div><h3>A practical guide to search relevance</h3><div class="preview-source">searchjournal.org ↗</div><div class="preview-line"></div><p>“A useful retrieval system combines the words people remember with the context around a document, including source and date...”</p><p><strong>Why this result?</strong><br>Your saved note mentions ranking by usefulness. The article title and text also match your query.</p><button class="btn primary">Open memory →</button></aside></div></template>
  <template id="library-view"><div class="eyebrow">YOUR KNOWLEDGE, IN ONE PLACE</div><h1>Everything worth<br><em>keeping.</em></h1><p class="subtitle">A home for ideas, references, and all the things you'll want again.</p><div class="section-head"><div><h2>All memories <span style="color:#a9b0b6;font-size:15px">24</span></h2><p>Recently saved, always within reach.</p></div><button class="btn primary">＋ New memory</button></div><div class="filter-row"><button class="pill on">All</button><button class="pill">Web pages</button><button class="pill">Documents</button><button class="pill">Images</button><button class="pill">Notes</button></div><div class="library-grid"><div class="memory-card"><div class="card-top"><span class="file-icon">↗</span><span>Oct 12</span></div><div class="card-title">A practical guide to search relevance</div><div class="card-note">Why I saved it: useful ranking patterns for the project.</div><div class="card-foot"><span>searchjournal.org</span><span>Context OS</span></div></div><div class="memory-card"><div class="card-top"><span class="file-icon pdf">▤</span><span>Sep 28</span></div><div class="card-title">Information retrieval field notes</div><div class="card-note">The paper with the chart about partial memory.</div><div class="card-foot"><span>PDF · 18 pages</span><span>Research</span></div></div><div class="memory-card"><div class="card-top"><span class="file-icon note">✎</span><span>Nov 2</span></div><div class="card-title">Ideas for finding forgotten articles</div><div class="card-note">Possible clues: topic, source, color, and approximate time.</div><div class="card-foot"><span>Personal note</span><span>Context OS</span></div></div><div class="memory-card"><div class="card-top"><span class="file-icon">↗</span><span>Oct 30</span></div><div class="card-title">Designing resilient background jobs</div><div class="card-note">Retry and lease patterns for the extraction pipeline.</div><div class="card-foot"><span>engineering.example</span><sp   <template id="detail-view"><div class="section-head"><div><div class="eyebrow">SAVED SOURCE</div><h1 style="font-size:40px;margin-bottom:0">A memory, with<br><em>its context intact.</em></h1></div><button class="btn">← Back to results</button></div><p class="subtitle" style="margin-top:12px">Original material and your own notes stay clearly separated.</p><div class="detail-grid"><article class="panel document"><div class="detail-topline"><span>WEB PAGE · SAVED OCT 12</span><span>OPEN ORIGINAL ↗</span></div><h2>A practical guide to search relevance</h2><div class="source">searchjournal.org · Originally published Sep 29</div><hr><p>Good search starts with what a person can remember. Sometimes that's a phrase; other times it's a half-remembered topic, a source, or a moment in time.</p><p>A strong retrieval system balances exact words with context. <mark>Ranking search results by usefulness</mark> helps people reach the original source quickly, with enough explanation to trust the match.</p><p>The source remains the source of truth. Notes and generated summaries should sit beside it, clearly labeled.</p></article><aside class="panel context-panel"><h3>Context around this memory</h3><div class="context-block"><div class="label">WHY YOU SAVED IT</div><p>Useful ranking patterns for the Context OS search experience.</p></div><div class="context-block"><div class="label">PROJECTS</div><span class="tag">Context OS</span><span class="tag">Research</span></div><div class="context-block"><div class="label">RELATED MEMORY</div><p>Information retrieval field notes.pdf →</p></div><div class="context-block"><div class="label">SOURCE DETAILS</div><p>Captured Oct 12 · Web page<br>Text extraction complete<br>Original URL preserved</p></div></aside></div></template>
